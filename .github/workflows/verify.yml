name: Verify Beat Drop design integration
on:
  push:
    branches: [main, feat/lovable-design-integration]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact app dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test React screens
        run: npm run test:design
      - name: TypeScript design integration check
        run: npx tsc --noEmit
      - name: Test legacy music and protocol
        run: npm run test:legacy
      - name: Syntax-check safe local deployer helpers
        run: |
          node --check scripts/deployer-path.cjs
          node --check scripts/prepare-deployer.cjs
          node --check scripts/deployer-status.cjs
          node --check scripts/deploy.cjs
          node --check scripts/check-testnet.cjs
      - name: Compile Solidity
        run: npm run contracts:compile
      - name: Contract tests
        run: npm run contracts:test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser UI integration checks
        run: npm run test:e2e
      - name: Build React production app
        run: npm run build
      - name: Verify Vercel Functions output
        run: |
          npm run build:vercel
          test ! -f index.html
          test -f .vercel/output/config.json
          test -d .vercel/output/functions
          if grep -R --include='*.html' -l '/src/main.js' .vercel/output/static 2>/dev/null; then
            echo 'ERROR: Legacy index.html found inside Vercel output; it will white-screen the React app.'
            exit 1
          fi

