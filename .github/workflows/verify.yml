name: Verify Beat Drop
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Sequencer unit tests
        run: npm test
      - name: Compile Solidity
        run: npm run contracts:compile
      - name: Contract tests
        run: npm run contracts:test
      - name: Install Chromium\n        run: npx playwright install --with-deps chromium\n      - name: Browser smoke tests\n        run: npm run test:e2e\n      - name: Production web build
        run: npm run build
